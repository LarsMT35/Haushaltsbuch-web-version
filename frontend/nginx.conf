server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html referenziert die aktuellen gehashten JS/CSS-Dateien – muss
    # bei jedem Update sofort neu geladen werden, sonst läuft der Browser
    # nach einem Update weiter mit dem alten Bundle (Cache auf index.html).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gehashte Assets (index-XXXX.js/css) ändern bei jedem Build ihren
    # Dateinamen – dürfen daher unbegrenzt/aggressiv gecacht werden.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Frontend spricht nur die versionierte API (Prinzip 5)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }
}
