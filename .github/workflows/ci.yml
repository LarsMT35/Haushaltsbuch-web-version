name: CI

# Bis hierher liefen die Tests nur, wenn jemand daran dachte. Jetzt prüft jeder
# Push und jeder Pull Request beides: dass die Backend-Tests durchlaufen und
# dass das Frontend überhaupt baut.
#
# Backend-Tests und Migrationen laufen zusätzlich gegen ECHTES PostgreSQL 16
# (siehe docker-compose.yml – das ist die Datenbank des Live-Systems, SQLite
# ist nur der schnelle Entwicklungs-Fallback, siehe README). Reiner
# SQLite-Betrieb hatte Fehler verdeckt, die erst auf PostgreSQL auftraten
# (z.B. verletzt PostgreSQL Fremdschlüssel, die SQLite ohne explizites PRAGMA
# stillschweigend ignoriert) – genau solche Fehler landeten sonst erst live
# beim Nutzer statt hier.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend-Tests (pytest, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haushaltsbuch_test
          POSTGRES_USER: haushaltsbuch
          POSTGRES_PASSWORD: haushaltsbuch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haushaltsbuch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # gleiche Version wie im Container (backend/Dockerfile)
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        working-directory: backend
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            export DATABASE_URL="postgresql+psycopg2://haushaltsbuch:haushaltsbuch@localhost:5432/haushaltsbuch_test"
          fi
          # sonst: kein DATABASE_URL gesetzt -> conftest.py greift auf die
          # SQLite-Fallback-Datei zurück
          pytest -q

  frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # gleiche Version wie im Container (frontend/Dockerfile)
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  migrations:
    name: Alembic-Migrationen laufen durch (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haushaltsbuch_migcheck
          POSTGRES_USER: haushaltsbuch
          POSTGRES_PASSWORD: haushaltsbuch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haushaltsbuch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhängigkeiten installieren
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Die Migrationen laufen beim Container-Start automatisch – schlägt eine
      # fehl, merkt man es sonst erst beim Deployment auf dem Zielsystem.
      # Live läuft PostgreSQL (docker-compose.yml); das ist der eigentlich
      # relevante Check, SQLite bleibt als schnelle Zusatzprobe bestehen.
      - name: upgrade head auf leerer Datenbank
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-nur-fuer-den-testlauf
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            export DATABASE_URL="postgresql+psycopg2://haushaltsbuch:haushaltsbuch@localhost:5432/haushaltsbuch_migcheck"
          else
            export DATABASE_URL="sqlite:///./ci-migration-check.db"
          fi
          alembic upgrade head
